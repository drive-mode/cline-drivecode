# Shared Bun workspace bootstrap for CI jobs.
#
# The install cache is restored on Windows ONLY. Measured on the e2e job, which
# reports restore and install as separate steps: restoring costs 43s (ubuntu)
# and 52s (macOS) to avoid an install that costs 8s and 14s respectively — so
# on those runners the cache is 3-5x more expensive than the work it replaces.
# Windows keeps it, where cold install really is 3-5+ min.
name: Setup Bun workspace
description: Install Bun, restore install cache, and bun install at the repo root

inputs:
    frozen-lockfile:
        description: Pass --frozen-lockfile to bun install
        required: false
        default: "true"
    working-directory:
        description: Directory for bun install (repo root by default)
        required: false
        default: "."
    cache:
        description: >-
            Opt in to restoring ~/.bun/install/cache. Honoured on Windows only;
            on Linux and macOS the restore costs more than a cold install, so it
            is skipped regardless of this value.
        required: false
        default: "true"

runs:
    using: composite
    steps:
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version-file: package.json

        - name: Cache Bun install cache
          # Windows-only: see the header note. Left as a condition rather than a
          # per-caller override so a new job cannot silently reintroduce the cost.
          if: ${{ inputs.cache == 'true' && runner.os == 'Windows' }}
          uses: actions/cache@v4
          with:
              path: ~/.bun/install/cache
              key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock') }}
              restore-keys: |
                  ${{ runner.os }}-bun-

        - name: Install workspace dependencies
          shell: bash
          working-directory: ${{ inputs.working-directory }}
          env:
              GITHUB_TOKEN: ${{ github.token }}
          run: |
              if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
                bun install --frozen-lockfile
              else
                bun install
              fi
