name: docs-link-check

on:
    push:
        branches:
            - main
        paths:
            - "**/*.md"
            - "**/*.mdx"
            - "docs/docs.json"
            - "sdk/scripts/check-links.ts"
            - "sdk/scripts/check-drivecode-structure.ts"
            - "sdk/scripts/check-drivecode-structure.test.ts"
            - "sdk/scripts/check-drivecode-done.ts"
            - "sdk/scripts/check-drivecode-done.test.ts"
            - "package.json"
            - "docs/drivecode/**"
            - ".github/workflows/docs-link-check.yml"
    # Deliberately unfiltered by base branch (same as drive-ci / #171).
    # `branches: [main]` skips mid-stack PRs whose base is another feature
    # branch — ADR-0026 §4 / stacked-PR hole.
    pull_request:
        paths:
            - "**/*.md"
            - "**/*.mdx"
            - "docs/docs.json"
            - "sdk/scripts/check-links.ts"
            - "sdk/scripts/check-drivecode-structure.ts"
            - "sdk/scripts/check-drivecode-structure.test.ts"
            - "sdk/scripts/check-drivecode-done.ts"
            - "sdk/scripts/check-drivecode-done.test.ts"
            - "package.json"
            - "docs/drivecode/**"
            - ".github/workflows/docs-link-check.yml"
    schedule:
        # External links rot on their own schedule, so sweep them weekly.
        - cron: "17 6 * * 1"
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    # Blocking: repo-relative and GitHub-absolute paths are resolved against the
    # checkout, so this is hermetic and cannot flake on someone else's outage.
    internal:
        runs-on: ubuntu-latest
        name: Internal links
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            # --no-site keeps this gate hermetic. The published site is checked by
            # the scheduled job, where an outage cannot block anyone's merge.
            - name: Check internal links
              run: bun sdk/scripts/check-links.ts --no-site

            - name: Check docs/drivecode structure
              run: bun sdk/scripts/check-drivecode-structure.ts

            - name: Check docs/drivecode Done claims
              run: bun sdk/scripts/check-drivecode-done.ts

            - name: Test docs/drivecode structure and Done gates
              run: bun test sdk/scripts/check-drivecode-structure.test.ts sdk/scripts/check-drivecode-done.test.ts

    # Non-blocking: crawls cline.bot and checks external URLs, both of which depend
    # on availability outside this repo. Runs weekly and on demand.
    external:
        # `github.workflow` is the caller's name, so this stays off when another
        # workflow (a publish, say) calls this one for the blocking internal check.
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.workflow == 'docs-link-check')
        runs-on: ubuntu-latest
        name: External links
        continue-on-error: true
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Check external and site links
              run: bun sdk/scripts/check-links.ts --external --json link-report.json

            - name: Upload report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: link-report
                  path: link-report.json
                  if-no-files-found: ignore
