name: sdk-test

on:
    push:
        branches:
            - main
        paths:
            - "sdk/**"
            - "package.json"
            - "bun.lock"
            - ".github/workflows/sdk-test.yml"
            - ".github/actions/setup-bun-workspace/**"
    workflow_dispatch:
    # Deliberately unfiltered by base branch (same as drive-ci / #171).
    # `branches: [main]` skips mid-stack PRs whose base is another feature
    # branch — ADR-0026 §4 / stacked-PR hole.
    pull_request:
        paths:
            - "sdk/**"
            - "package.json"
            - "bun.lock"
            - ".github/workflows/sdk-test.yml"
            - ".github/actions/setup-bun-workspace/**"
    workflow_call:

permissions:
    contents: read

concurrency:
    # Match ext-vscode-test: use run_id for non-PR so main pushes and
    # sdk-publish's reusable call do not cancel each other.
    group: sdk-test-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: .

jobs:
    # Fail-fast gate: cheap lint before the heavy typecheck/build.
    quality-checks:
        runs-on: ubuntu-latest
        name: Quality Checks
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun workspace
              uses: ./.github/actions/setup-bun-workspace

            # Lint/format first so format failures abort before ~2 min of typecheck.
            - name: Lint & Format
              run: bun run lint

            - name: Typecheck
              run: |
                  bun run build:sdk
                  bun run -F @cline/cli build
                  bun run types

    matrix_prep:
        needs: quality-checks
        runs-on: ubuntu-latest
        name: Test matrix
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - id: set-matrix
              run: |
                  # PRs: Ubuntu only (Windows cold install was 4–5 min of wall clock).
                  # push / workflow_dispatch / workflow_call (ci/sdk force): Ubuntu + Windows.
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    echo 'matrix=[{"os":"ubuntu-latest","node-version":"24.x"}]' >> "$GITHUB_OUTPUT"
                  else
                    echo 'matrix=[{"os":"ubuntu-latest","node-version":"24.x"},{"os":"windows-latest","node-version":"24.x"}]' >> "$GITHUB_OUTPUT"
                  fi

    # OS matrix. fail-fast cancels the sibling OS when one fails.
    test:
        needs: [quality-checks, matrix_prep]
        strategy:
            fail-fast: true
            matrix:
                include: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
        runs-on: ${{ matrix.os }}
        name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun workspace
              uses: ./.github/actions/setup-bun-workspace

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Build SDK
              id: build_sdk_step
              run: bun run build:sdk

            - name: Build CLI
              id: build_cli_step
              run: bun -F @cline/cli build

            - name: Run Tests
              if: matrix.os != 'windows-latest'
              run: bun run test

            - name: Run SDK Tests (Windows)
              if: matrix.os == 'windows-latest'
              run: bun -F './sdk/packages/**' test

            - name: Smoke test SQLite under Node
              if: matrix.os != 'windows-latest'
              timeout-minutes: 10
              run: bun sdk/scripts/ci-node-smoke.ts

    # Parallel with the OS test matrix so TUI e2e does not serialize behind unit tests.
    tui-and-publish:
        needs: quality-checks
        runs-on: ubuntu-latest
        name: TUI e2e + publish check
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun workspace
              uses: ./.github/actions/setup-bun-workspace

            - name: Build SDK
              run: bun run build:sdk

            - name: Build CLI
              run: bun -F @cline/cli build

            - name: Run TUI e2e tests
              run: bun -F @cline/cli test:e2e:cli:tui

            - name: Verify packages are publishable
              run: bun sdk/scripts/check-publish.ts

    # Stable required-check name. Job-level Windows checks no longer run on PRs
    # (matrix is Ubuntu-only), and TUI e2e lives in a sibling job — this gate
    # keeps one always-reported status that fails if either suite failed.
    test-result:
        needs: [quality-checks, test, tui-and-publish]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        name: test
        steps:
            - name: Verify sdk-test jobs
              env:
                  QUALITY: ${{ needs.quality-checks.result }}
                  TEST: ${{ needs.test.result }}
                  TUI: ${{ needs.tui-and-publish.result }}
              run: |
                  fail=0
                  for pair in "quality-checks:$QUALITY" "test:$TEST" "tui-and-publish:$TUI"; do
                    name="${pair%%:*}"
                    result="${pair#*:}"
                    echo "$name=$result"
                    if [ "$result" != "success" ]; then
                      fail=1
                    fi
                  done
                  if [ "$fail" -ne 0 ]; then
                    echo "One or more sdk-test jobs failed or were cancelled"
                    exit 1
                  fi
                  echo "sdk-test gate passed"
