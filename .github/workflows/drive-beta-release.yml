# Drive self-hosted beta release (MVP phase 5).
#
# Deliberately narrow, because the beta is clone-and-run: the artifact a tester
# uses is the repository at a tag, not a package. So this workflow verifies a
# commit builds and passes its checks, tags it, and opens a DRAFT release.
#
# Three things it does NOT do, on purpose:
#   - never runs on push or merge. `workflow_dispatch` only.
#   - never publishes. The release is created as a draft; a human presses
#     Publish in the GitHub UI. Nothing reaches a registry.
#   - never touches the upstream publish workflows (cli-publish,
#     ext-vscode-publish-*, desktop-publish, sdk-publish, ui-publish). Those
#     ship under Cline's identity; this fork does not use them.
name: drive-beta-release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to create, e.g. drive-beta/v0.1.0"
                required: true
                type: string
            confirm:
                description: 'Type "tag" to confirm creating the tag and draft release'
                required: true
                type: string
            prerelease:
                description: Mark the draft release as a prerelease
                required: false
                type: boolean
                default: true

concurrency:
    group: drive-beta-release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    verify:
        name: Verify the beta build
        # Only this fork. A fork-of-a-fork inherits the workflow but not the intent.
        if: github.repository == 'hhalperin/cline-drivecode'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Preflight checks the installed Node against engines.node, so pin
            # it rather than trusting whatever the runner image ships.
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Setup Bun workspace
              uses: ./.github/actions/setup-bun-workspace

            # Same order as the install docs: install, build, then preflight —
            # which is also the only order that passes, since preflight FAILs
            # when the SDK dist output is missing.
            - name: Build SDK packages
              run: bun run build:sdk

            - name: Preflight
              run: bun run preflight

            - name: Typecheck hub
              run: bun -F @cline/cline-hub typecheck

            - name: Test hub
              run: bun -F @cline/cline-hub test

            - name: Test Drive kernel
              run: bun -F @cline/drive test

            - name: Build hub webview
              run: bun -F @cline/cline-hub build:webview

            - name: Check docs structure
              run: bun run check:drivecode-docs

            - name: Check docs links
              run: bun sdk/scripts/check-links.ts --no-site

    tag-and-draft:
        name: Tag and open a draft release
        needs: verify
        if: github.repository == 'hhalperin/cline-drivecode' && inputs.confirm == 'tag'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Validate the tag name
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  if ! printf '%s' "$TAG" | grep -qE '^drive-beta/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
                    echo "Tag must look like drive-beta/v0.1.0 — got: $TAG"
                    exit 1
                  fi

            - name: Create and push the tag
              uses: ./.github/actions/release-tag
              with:
                  tag: ${{ inputs.tag }}
                  message: "Drive self-hosted beta ${{ inputs.tag }}"

            # Draft, so the tag exists but nothing is announced until a human
            # reviews the notes and presses Publish.
            - name: Open a draft release
              env:
                  TAG: ${{ inputs.tag }}
                  PRERELEASE: ${{ inputs.prerelease }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "A release already exists for $TAG; leaving it alone."
                    exit 0
                  fi
                  NOTES_FILE="$(mktemp)"
                  {
                    echo "Drive is public but self-hosted: clone this repository at \`$TAG\` and run it."
                    echo
                    echo '```bash'
                    echo "git clone --branch $TAG https://github.com/hhalperin/cline-drivecode.git"
                    echo "cd cline-drivecode"
                    echo "bun run preflight"
                    echo "bun install --frozen-lockfile"
                    echo "bun run build:sdk"
                    echo "bun run --cwd apps/cline-hub dev"
                    echo '```'
                    echo
                    echo "- [Install guide](https://github.com/hhalperin/cline-drivecode/blob/$TAG/docs/drivecode/reference/install.md)"
                    echo "- [Privacy](https://github.com/hhalperin/cline-drivecode/blob/$TAG/docs/drivecode/reference/privacy.md)"
                    echo "- [Support](https://github.com/hhalperin/cline-drivecode/blob/$TAG/docs/drivecode/plans/cline-drivemode/ops/beta-support.md)"
                  } > "$NOTES_FILE"
                  ARGS=(--draft --title "Drive beta $TAG" --notes-file "$NOTES_FILE")
                  if [ "$PRERELEASE" = "true" ]; then
                    ARGS+=(--prerelease)
                  fi
                  gh release create "$TAG" "${ARGS[@]}"
                  echo "Draft release created. Publish it from the GitHub UI when ready." >> "$GITHUB_STEP_SUMMARY"
