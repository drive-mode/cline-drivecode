# Publish @drive-mode/drive-kernel — the generated distribution of the Drive
# room kernel and protocol schemas — to GitHub Packages.
#
# The package is GENERATED (sdk/scripts/build-drive-kernel-bundle.ts) and its
# output is gitignored, so it is built here rather than committed. Publishing
# runs `check:drive-kernel` first, which regenerates from the canonical
# @cline/drive and @cline/shared, compiles the distribution, and asserts the
# declared surface still resolves — a rename upstream fails the publish rather
# than shipping a stale copy, which is how the retired collaboration-harness
# drifted.
#
# The version comes from `sdk/drive-kernel.version.json`, which the
# distribution owns. It used to be inherited from @cline/drive, but SDK
# releases rewrite every sdk/packages/* version at once, so the bundle had no
# version it could move between releases. Bump that file to publish a change.
#
# Unlike sdk-publish.yml this targets GitHub Packages, not npmjs.org: the
# @drive-mode scope is private to the org, so no npm trusted publishing / OIDC
# is involved and the built-in GITHUB_TOKEN carries `packages: write`.
name: drive-kernel-publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        required: false
        type: boolean
        default: true

concurrency:
  group: drive-kernel-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @drive-mode/drive-kernel
    # The upstream fork must never publish under our scope.
    if: github.repository == 'drive-mode/cline-drivecode'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@drive-mode"

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The guard resolves the declared surface against the canonical packages'
      # built dist, so the SDK must be built before it can run.
      - name: Build SDK
        run: bun run build:sdk

      # Regenerates, compiles, imports the compiled dist under Node, and fails
      # on drift, a missing entrypoint, or an undeclared dependency.
      - name: Generate and verify the distribution
        run: bun run check:drive-kernel

      - name: Read package identity
        id: pkg
        run: |
          cd sdk/dist-bundle/drive-kernel
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Prepared ${NAME}@${VERSION}"

      # A real publish of a version already on the registry publishes NOTHING,
      # so it FAILS here rather than skipping. The skip is the footgun this
      # replaces: the job stayed green, the summary said "skipped", and a
      # maintainer reading a green run reasonably concluded the change shipped.
      # A dry run only warns — packing an already-published version to verify
      # the tarball is legitimate.
      - name: Check the version is unpublished
        id: exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ! npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning::${NAME}@${VERSION} is already published — a real run at this version would publish nothing and fail."
            exit 0
          fi
          echo "::error::${NAME}@${VERSION} is already published, so this run would publish nothing. Bump \"version\" in sdk/drive-kernel.version.json and re-dispatch. If the kernel has not changed since that version, there is nothing to publish."
          exit 1

      - name: Pack (dry run)
        if: inputs.dry_run
        working-directory: sdk/dist-bundle/drive-kernel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --dry-run

      # No `published == 'false'` guard: the step above already failed the job
      # in that case. A second condition here would silently re-introduce the
      # skip if that step were ever relaxed.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: sdk/dist-bundle/drive-kernel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Summary
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALREADY: ${{ steps.exists.outputs.published }}
        run: |
          {
            echo "### ${NAME}@${VERSION}"
            echo ""
            echo "- source commit: \`${GITHUB_SHA}\`"
            if [ "$DRY_RUN" != "true" ]; then
              echo "- result: **published** to GitHub Packages"
            elif [ "$ALREADY" = "true" ]; then
              echo "- result: **dry run** — packed and verified, but this version is ALREADY on the registry, so a real run would fail. Bump \`sdk/drive-kernel.version.json\` first."
            else
              echo "- result: **dry run** — packed and verified, nothing published"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
