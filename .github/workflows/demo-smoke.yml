name: demo-smoke

on:
    pull_request:
        paths:
            - "docs/drivecode/design/canvases/**"
            - "docs/drivecode/assets/demos/voice/**"
            - ".github/workflows/demo-smoke.yml"

permissions:
    contents: read

jobs:
    smoke:
        runs-on: ubuntu-latest
        name: Demo canvas smoke
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            # The empty package.json seed keeps `bun add` from walking up and
            # attaching puppeteer-core to docs/package.json. Chrome is
            # preinstalled on ubuntu-latest runners.
            - name: Run demo smoke
              run: |
                  cd docs/drivecode/design/canvases
                  echo '{}' > package.json
                  bun add puppeteer-core@23
                  CHROME_PATH=$(which google-chrome) bun verify.js
